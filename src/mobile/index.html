<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- No viewport-fit=cover: Android then keeps the app clear of the status and navigation bars. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aurora Music</title>
    <!-- Google's image servers answer 429 to a Referer of https://localhost/ (the WebView's origin). -->
    <meta name="referrer" content="no-referrer" />
    <!-- 'unsafe-eval': youtubei.js runs YouTube's signature functions with new Function. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https:; font-src 'self' data:"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
