name: Build & Release

# Every push and PR: typecheck, test, and build installers for all three OSes
# (downloadable from the run's artifacts).
# A `v*` tag (or a manual run with a version): the same, then one GitHub
# Release with every installer attached: macOS dmg/zip (universal), Windows
# setup + portable (x64/arm64), Linux AppImage/deb/rpm, the Android APK, the
# iPhone .ipa, plus the latest*.yml files electron-updater reads.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to create, e.g. v0.1.1 (leave empty to only build)'
        required: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Linux packaging tools
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools
      - run: npm ci
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        shell: bash
        run: |
          TAG="${{ inputs.version || github.ref_name }}"
          npm version "${TAG#v}" --no-git-tag-version --allow-same-version
      - run: npm run build
        env:
          # Optional: Last.fm scrobbling is offered only when these repository secrets exist.
          MAIN_VITE_LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          MAIN_VITE_LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          MAIN_VITE_DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
      - name: Package (${{ matrix.platform }})
        shell: bash
        env:
          SIGNING_CERT: ${{ secrets.CSC_LINK }}
          SIGNING_CERT_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          # An unset secret arrives as an empty string, and electron-builder reads an
          # empty CSC_LINK as a path ("<workspace> not a file"). Only export signing
          # variables when a certificate actually exists; otherwise build unsigned.
          if [ -n "$SIGNING_CERT" ]; then
            export CSC_LINK="$SIGNING_CERT" CSC_KEY_PASSWORD="$SIGNING_CERT_PASSWORD"
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npx electron-builder --${{ matrix.platform }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: aurora-music-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            release/*/*.dmg
            release/*/*.zip
            release/*/*.exe
            release/*/*.AppImage
            release/*/*.deb
            release/*/*.rpm
            release/*/*.blockmap
            release/*/latest*.yml

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        shell: bash
        run: |
          TAG="${{ inputs.version || github.ref_name }}"
          echo "AURORA_VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: Signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # Every release must be signed with the same key, or Android refuses to
          # install it over the previous one. Without the secret (forks, PRs from
          # them) the job builds a debug APK instead.
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/aurora-release.jks"
            echo "AURORA_KEYSTORE=$RUNNER_TEMP/aurora-release.jks" >> "$GITHUB_ENV"
          fi
      - name: Build APK
        shell: bash
        env:
          AURORA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AURORA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AURORA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          npm run build:mobile
          npx cap sync android
          mkdir -p apk
          VERSION="${AURORA_VERSION:-dev}"
          if [ -n "$AURORA_KEYSTORE" ]; then
            (cd android && ./gradlew assembleRelease --no-daemon)
            cp android/app/build/outputs/apk/release/app-release.apk "apk/Aurora-Music-$VERSION-android.apk"
          else
            (cd android && ./gradlew assembleDebug --no-daemon)
            cp android/app/build/outputs/apk/debug/app-debug.apk "apk/Aurora-Music-$VERSION-android-debug.apk"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: aurora-music-android
          if-no-files-found: error
          path: apk/*.apk

  ios:
    needs: test
    # Capacitor 8 needs Xcode 26. The .ipa is unsigned: people install it with
    # AltStore or SideStore, which sign it with their own Apple ID.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - run: npm ci
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        shell: bash
        run: |
          TAG="${{ inputs.version || github.ref_name }}"
          echo "AURORA_VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: Build the .ipa
        run: |
          set -o pipefail
          VERSION="${AURORA_VERSION:-0.0.0}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          BUILD=$(( ${MAJOR:-0} * 10000 + ${MINOR:-0} * 100 + ${PATCH:-0} ))
          npm run build:mobile
          npx cap sync ios
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/device \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$(( BUILD > 0 ? BUILD : 1 ))" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -15
          mkdir -p ipa/Payload
          cp -R build/device/Build/Products/Release-iphoneos/App.app ipa/Payload/
          (cd ipa && zip -qr "../Aurora-Music-${AURORA_VERSION:-dev}-ios.ipa" Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: aurora-music-ios
          if-no-files-found: error
          path: Aurora-Music-*-ios.ipa

  release:
    needs: [package, android, ios]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List release files
        run: find dist -type f | sort
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          name: Aurora Music ${{ inputs.version || github.ref_name }}
          generate_release_notes: true
          files: dist/**/*
