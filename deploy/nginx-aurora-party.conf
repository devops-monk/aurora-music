# party.devops-monk.com → Aurora Music Listen Together (127.0.0.1:8765).
# certbot --nginx adds the 443 block and redirect to this file only.
server {
    listen 80;
    server_name party.devops-monk.com;

    limit_conn perip 20;

    # Parties are one long WebSocket per device.
    location /ws/ {
        proxy_pass         http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        limit_req zone=api burst=30 nodelay;
        proxy_pass         http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        # Overwritten, not appended, so a client can't spoof its address for the rate limiter.
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
